name: CI

on:
  push:
    branches: [main]
  pull_request:
  # gitleaks scans only the commits of the triggering event. A full sweep of the
  # history needs an event that is not tied to a diff, which is what the audit
  # before publishing the repository requires.
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit rather than a tag. A tag can be moved to point
# at different code after review, which matters most for the third-party
# scanner: it runs with repository contents in scope on every push.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # `playwright install` is deliberately skipped. The browser is downloaded
        # on demand by page rendering, which no test reaches.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q

  coverage:
    # One interpreter only. Running this across the matrix would report three
    # slightly different numbers for the same commit and say nothing extra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Measure coverage
        run: python -m pytest -q --cov --cov-report=term-missing
      - name: Publish the report to the run summary
        # Runs even on failure: when the floor is what broke the build, the
        # table showing which module dropped is the thing worth reading.
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            python -m coverage report --no-skip-covered 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      # The rule selection lives in pyproject.toml, so a local run and this job
      # cannot disagree about what counts as a defect.
      - name: Check for defects
        run: ruff check feedian tests

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks reads the pull request's commit list, which the workflow-wide
      # contents-only permission does not cover.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secrets have to be hunted through the whole history, not just the
          # diff: a key removed in a later commit is still published with the
          # repository.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Required since v3 to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
